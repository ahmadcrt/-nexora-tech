name: Apply update bundle

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Check the bundle
        run: |
          test -f nexora-update.zip || { echo "::error::nexora-update.zip was not found in the repository root."; exit 1; }
          if unzip -Z1 nexora-update.zip | grep -E '(^/|\.\./|^\.github/|^\.git/)'; then
            echo "::error::The bundle contains a forbidden path."
            exit 1
          fi
          echo "Files in the bundle:"
          unzip -Z1 nexora-update.zip | grep -v '/$' | head -100

      - name: Unpack the bundle
        run: |
          unzip -o nexora-update.zip
          rm -f nexora-update.zip
          rm -rf __MACOSX

      - name: Confidentiality check before commit
        run: |
          set -e
          git add -A
          FILES=$(git diff --cached --name-only)
          echo "$FILES"
          FOUND=0
          for f in $FILES; do
            [ -f "$f" ] || continue
            case "$f" in *.png|*.otf|*.ttf|*.jpg) continue;; esac
            if grep -nE 'eyJ[A-Za-z0-9_-]{20,}\.[A-Za-z0-9_-]{20,}\.|sb_secret_[A-Za-z0-9]|-----BEGIN [A-Z ]*PRIVATE KEY|postgres(ql)?://[^ ]+:[^ @]+@' "$f"; then
              echo "::error::Possible secret found in $f"
              FOUND=1
            fi
          done
          if [ "$FOUND" = "1" ]; then exit 1; fi
          echo "No secrets found."

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --cached --quiet; then
            echo "Nothing to commit."
          else
            git commit -m "feat: Supabase integration, admin dashboard and security hardening"
            git push
          fi
